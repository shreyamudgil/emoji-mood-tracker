<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quick Emoji Mood Tracker</title>
    <meta
      name="description"
      content="Tap an emoji, jot a one-sentence note, and keep a private mood history in this browser."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="paper">
      <header class="masthead">
        <p class="kicker">Private · this browser only</p>
        <h1>How are you, right now?</h1>
        <p class="lede">
          Pick an emoji, add one sentence if you want, and keep a quiet log of
          the last few moods.
        </p>
      </header>

      <main>
        <section class="card" aria-labelledby="mood-heading">
          <h2 id="mood-heading">Mood</h2>
          <div
            id="mood-grid"
            class="mood-grid"
            role="radiogroup"
            aria-labelledby="mood-heading"
          ></div>
        </section>

        <section class="card" aria-labelledby="note-heading">
          <div class="note-head">
            <h2 id="note-heading">One-sentence note</h2>
            <span id="char-count" class="char-count">0 / 140</span>
          </div>
          <label class="sr-only" for="note-input">Optional mood note</label>
          <textarea
            id="note-input"
            maxlength="140"
            rows="2"
            placeholder="Optional — one short sentence about this moment."
          ></textarea>
          <div class="actions">
            <button type="button" id="save-btn" class="btn primary" disabled>
              Log this mood
            </button>
            <p id="status" class="status" role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="card history-card" aria-labelledby="history-heading">
          <div class="history-head">
            <h2 id="history-heading">Recent history</h2>
            <button type="button" id="clear-btn" class="btn ghost" hidden>
              Clear all
            </button>
          </div>
          <ol id="history-list" class="history-list"></ol>
        </section>
      </main>

      <footer>
        Saved on this device. Clearing site data or using another browser starts
        a fresh log.
      </footer>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
